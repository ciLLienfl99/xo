name: Verify Mac Local-Use Recovery
run-name: Mac local-use recovery · ${{ github.run_number }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-macos-local-use.yml'
      - '.github/scripts/test_macos_local_use.py'
      - 'support/OxideTerm-First-Launch.command'

permissions:
  contents: read

concurrency:
  group: verify-macos-local-use
  cancel-in-progress: true

jobs:
  test:
    name: Verify scoped recovery, not notarization
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Checkout first-launch support
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Python for tests only
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Check macOS built-in Bash compatibility
        run: /bin/bash -n support/OxideTerm-First-Launch.command
      - name: Test integrity, quarantine scope, data preservation and local startup
        run: python .github/scripts/test_macos_local_use.py
      - name: Upload exact tested first-launch tool
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: OxideTerm-First-Launch-Helper
          path: support/OxideTerm-First-Launch.command
          if-no-files-found: error
          retention-days: 30
      - name: Upload truthful diagnostics including Gatekeeper rejection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: OxideTerm-Local-Use-Check
          path: local-use-results/*
          if-no-files-found: warn
          retention-days: 30
